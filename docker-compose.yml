# docker compose up --build        -> application complète sur http://localhost:8080
# docker compose up -d db          -> uniquement PostgreSQL (développement local)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: ${DB_USERNAME:-stockpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockpilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockpilot
      DB_USERNAME: ${DB_USERNAME:-stockpilot}
      DB_PASSWORD: ${DB_PASSWORD:-stockpilot}
      # "demo" charge un jeu de données d'exemple au premier démarrage.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
    ports:
      - "8080:8080"

volumes:
  pgdata:
