spring.application.name=stockpilot

# Connexion PostgreSQL : surchargeable par variables d'environnement.
# Les valeurs par défaut correspondent au docker-compose.yml (développement local uniquement).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockpilot}
spring.datasource.username=${DB_USERNAME:stockpilot}
spring.datasource.password=${DB_PASSWORD:stockpilot}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
